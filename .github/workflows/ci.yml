name: CI

# common is not released on its own: server and client releases pin the commit
# they build with (COMMON_REF in those repositories).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web pages (type check and build)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run build

  rust:
    name: Crates (build and test)
    runs-on: windows-2022
    permissions:
      contents: read
    defaults:
      run:
        shell: pwsh
    steps:
      # The same layout as locally: common/ and third_party/ side by side.
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: common
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: common/web/package-lock.json

      - name: Set up Rust
        run: rustup toolchain install stable --profile minimal --no-self-update; rustup default stable

      - name: Cache FFmpeg
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: third_party/ffmpeg
          key: ffmpeg-${{ hashFiles('common/scripts/fetch-ffmpeg.ps1') }}

      - name: Fetch FFmpeg
        run: if (-not (Test-Path third_party/ffmpeg/bin)) { ./common/scripts/fetch-ffmpeg.ps1 }

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: common -> ../target

      - name: Test
        working-directory: common
        run: cargo test --release
